name: Publish Official GitHub Release v1.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Diggy Diggy Sand — v1.0.0 (Gold Master)"
          target_commitish: release/v1.0.0
          draft: false
          prerelease: false
          make_latest: "true"
          body: |
            ### 🌟 Diggy Diggy Sand v1.0.0 — Gold Master

            Prima release stabile e completa del gioco incrementale 3D Atlantean-Kemet:
            - **Core Engine:** Scavo procedurale 3D con Three.js r160, WebGL2 e PBR FBM 2048px.
            - **Biomi & Audio:** 4 Biomi (Deserto, Oceano, Ghiacciaio, Giungla) con BGM adattiva (Kevin MacLeod CC-BY 4.0).
            - **Modelli 3D:** Supporto dual-pipeline (Low-Poly GLTF Kenney/Quaternius CC0 e Mesh Procedurali).
            - **Progressione & Climax:** 4 Finali con regia cinematografica, Tavolette Antiche (τ), Santuario e Guardaroba Skin.
            - **Interfaccia & Mobile:** Layout a 3 tier (Desktop, Tablet, Smartphone con Bottom Sheet), Dock comandi e Medaglioni abilità attive.
            - **Stabilità:** PWA con Service Worker per giocabilità offline al 100%, Profiler F3 e anticheat.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

